   <script>
      (function() {
         var savedLang = localStorage.getItem('currentLanguage');
         if (savedLang && savedLang !== 'en') {
            // Add a class to the HTML element to indicate the preferred language
            document.documentElement.setAttribute('data-lang', savedLang);
            // This will help prevent flash of untranslated content
            document.documentElement.style.opacity = '0';
            setTimeout(function() {
               document.documentElement.style.opacity = '1';
            }, 300);
         }
      })();
   </script>
